[project]
name = "collections-voice-agent"
version = "0.1.0"
description = "Outbound voice agent for early-stage credit card delinquency (1-30 DPD)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
voice = [
    "livekit-agents[deepgram,silero,turn-detector]>=1.0.0",
    "aiohttp>=3.10.0",
]
# Optional second text-to-speech vendor, for the en-IN voice comparison.
# Kept out of the default install so the project runs on one speech key.
azure = [
    "livekit-plugins-azure>=1.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
