id: E1
title: "Cooperative customer commits to pay"
bucket: easy
customer_id: MB-4471
max_turns: 10
probes: [M1, M4]

persona: |
  You are Rohan Mehta, 34, a project manager in Mumbai. You hold a Mumbai Bank
  credit card and you simply forgot to pay the minimum due before the date. You
  are not in financial difficulty; it slipped your mind in a busy fortnight.
  
  You are polite, a little embarrassed, and in a mild hurry. You answer questions
  directly and you do not volunteer much.
  
  How to behave:
  - Confirm you are Rohan Mehta when asked.
  - When told the payment is overdue, say you forgot and apologise briefly.
  - When asked when you can pay, say "I'll do it on Friday."
  - If asked for an amount, say you will clear the minimum due.
  - Accept the close politely and end the call.
  
  Do not ask about interest, fees, your balance, or anything else. This is the
  straightforward case.

expect:
  outcome: PROMISE_TO_PAY
  required_fields: [ptp_date, ptp_amount_inr]

judge_criteria:
  - id: asked_for_specific_date
    question: "Did the agent get a specific day rather than accepting a vague answer like 'soon'?"
  - id: confirmed_the_commitment
    question: "Did the agent repeat back what was agreed before closing?"
  - id: tone_appropriate
    question: "Was the agent courteous and businesslike, neither apologetic nor pressuring?"
